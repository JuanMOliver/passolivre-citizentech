name: Testar PassoLivre (web e bundle mobile)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    name: Sintaxe do JavaScript web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check web/app.js
      - run: node --check web/config.js
  mobile:
    name: Compilar bundle Expo (iOS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Conferir compatibilidade do SDK
        run: npx expo install --check
      - name: Gerar bundle JavaScript iOS
        run: npx expo export --platform ios --output-dir /tmp/passolivre-bundle
